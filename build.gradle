
plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.2'
	id 'io.spring.dependency-management' version '1.1.7'
}


group = 'com.erp'
version = '0.0.1-SNAPSHOT'
description = 'ERP Cloud Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}
// Fast unit tests (no Spring context, no DB) run by default via `./gradlew test`.
// Tests tagged @Tag("integration") need a live MySQL matching application.properties
// and are excluded here -- run them explicitly with `./gradlew integrationTest`.
test {
	useJUnitPlatform {
		excludeTags 'integration'
	}
}

tasks.register('integrationTest', Test) {
	description = 'Runs @Tag("integration") tests that require a live MySQL connection (see application.properties).'
	group = 'verification'
	useJUnitPlatform {
		includeTags 'integration'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
}
repositories {
	mavenCentral()
}
dependencies {

	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// MySQL
	implementation 'com.mysql:mysql-connector-j'

	// Schema migrations (audit 2026-11-02, A3) -- versions managed by the Spring Boot BOM
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// DevTools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// TESTS
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	// SWAGGER
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    //Hibernate Envers for Automated Auditing
	implementation 'org.hibernate.orm:hibernate-envers'

	// Spring Security Starter Core Engine
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// JJWT API, Implementation, and Jackson Extensions for modern JWT parsing
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	// Withholding certificates (2026-11-07): Mustache resolves {{variable}} legal
	// text templates stored per-company in legal_document_templates; openhtmltopdf
	// converts the resolved HTML (shared by the preview endpoint and the final PDF)
	// into the downloadable PDF. First server-side PDF generation in this backend --
	// every export before this was client-side jsPDF in the frontend.
	implementation 'com.github.spullara.mustache.java:compiler:0.9.14'
	implementation 'io.github.openhtmltopdf:openhtmltopdf-core:1.1.30'
	implementation 'io.github.openhtmltopdf:openhtmltopdf-pdfbox:1.1.30'
	implementation 'io.github.openhtmltopdf:openhtmltopdf-slf4j:1.1.30'
}


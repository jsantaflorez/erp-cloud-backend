spring.application.name=erp-cloud
# Local secrets (DB password, JWT secret) live in application-local.properties,
# which is git-ignored and never committed. See application-local.properties.example.
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3308/erpdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=erp_cloud_app
spring.datasource.password=${DB_PASSWORD:CHANGEME_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Change from 'update' to 'validate' once your tables are stable
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
app.cors.allowed-origins=http://localhost:3000,https://app.erpcloud.com
app.security.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000

# Cuando tengas el dominio de producción, agrégalo en application-prod.properties:
#app.security.cors.allowed-origins=https://app.erpcloud.com
# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:CHANGEME_JWT_SECRET}
spring.application.name=erp-cloud
# Local secrets (DB password, JWT secret) live in application-local.properties,
# which is git-ignored and never committed. See application-local.properties.example.
spring.config.import=optional:file:./application-local.properties

# ---------------------------------------------------------------------------
# Database. Every value can be overridden by an environment variable; the
# defaults below are the LOCAL development setup. Production values live in
# application-prod.properties (SPRING_PROFILES_ACTIVE=prod), which has no
# defaults so a missing variable fails at startup instead of silently
# pointing at localhost.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/erpdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:erp_cloud_app}
spring.datasource.password=${DB_PASSWORD:CHANGEME_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Schema migrations (audit 2026-11-02, A3). ON since 2026-11-05: the V1
# baseline exists and the local erpdb is already baselined at version 1.
# Schema changes go in db/migration/V2__*.sql, V3__... and apply on startup.
# See src/main/resources/db/migration/README.md.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
app.jwt.secret=${JWT_SECRET:CHANGEME_JWT_SECRET}
# 8 hours (audit 2026-11-02, M2). Access is ALSO re-checked on every request
# by TenantFilter, so revoking a user does not wait for this to expire.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
# Role codes (roles.code) that count as administrator for @PreAuthorize
# ("@authz.isAdmin()"): user management, period/year closing, imports,
# consecutive reset, annulments. Check yours with: SELECT DISTINCT code FROM roles;
app.security.admin-roles=${ADMIN_ROLES:SYS_ADMIN,COMPANY_ADMIN}
# Brute-force protection (audit 2026-11-02, A2)
app.security.rate-limit.enabled=true
app.security.rate-limit.login-per-minute=5
app.security.rate-limit.company-lookup-per-minute=20
app.security.rate-limit.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}
app.security.login.max-failed-attempts=5
app.security.login.lock-minutes=15

# Never expose stack traces or exception messages in Spring's default error page
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# ---------------------------------------------------------------------------
# PRODUCTION profile (audit 2026-11-02, A5). Activate with:
#   SPRING_PROFILES_ACTIVE=prod
# No defaults on purpose: a missing variable stops the application at startup.
#
# Required environment variables:
#   DB_URL               jdbc:mysql://<host>:3306/erpdb?sslMode=REQUIRED&serverTimezone=UTC
#   DB_USERNAME          dedicated application user (never root)
#   DB_PASSWORD          different from any local/dev password
#   JWT_SECRET           64+ random characters, different from local
#   CORS_ALLOWED_ORIGINS https://app.your-domain.com
# Optional:
#   ADMIN_ROLES (default SYS_ADMIN,COMPANY_ADMIN), JWT_EXPIRATION_MS (default 8h),
#   TRUST_FORWARDED_FOR=true when running behind a load balancer / reverse proxy
# ---------------------------------------------------------------------------

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=${FLYWAY_ENABLED:true}

app.jwt.secret=${JWT_SECRET}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.security.rate-limit.trust-forwarded-for=${TRUST_FORWARDED_FOR:true}
server.forward-headers-strategy=framework

# API documentation is not public in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=INFO
logging.level.com.erp.erp_cloud=INFO
logging.level.org.hibernate.SQL=WARN
